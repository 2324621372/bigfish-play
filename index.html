// 公共工具：随机数、数学、存档、调试参数
const Q = new URLSearchParams(location.search);
const DBG = k => Q.has(k);
let _seed = (+Q.get('seed')) || ((Date.now() % 2147483646) + 1);
function rnd() { _seed = (_seed * 16807) % 2147483647; return (_seed - 1) / 2147483646; }
function R(a, b) { return a + rnd() * (b - a); }
function RI(a, b) { return Math.floor(R(a, b + 1)); }
function pick(a) { return a[Math.floor(rnd() * a.length)]; }
// 确定性哈希（装饰物、地形用，不消耗 rnd 序列）
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return (n >>> 0) / 4294967296; }
function hash2(a, b) { return hash((a * 73856093) ^ (b * 19349663)); }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - (1 - t) * (1 - t);

        say(run, perfect ? 'PERFECT 一口吞!' : big ? '撕咬成功!' : '吞下!', perfect ? '#ffe85a' : '#7aff9a', 1.1);
      } else {
        f.state = 'wander'; f.cool = 2; f.aggro = -2;
        const a = Math.atan2(P.y - f.y, P.x - f.x); P.vx = Math.cos(a) * 320; P.vy = Math.sin(a) * 320;
        f.vx = -Math.cos(a) * 300; f.vy = -Math.sin(a) * 300;
        if (big) hurt(run, 1, 'bite', f); else { if (CFG.hunger) P.hunger = Math.max(0, P.hunger - 6); floatText(run, P.x, P.y - P.r, '被弹开', '#ff8a8a', .9); }
        run.combo = 0; run.comboT = 0;
      }
    } });
  },
  // 挣脱：缠在身上的结按 1→n 依次点掉
  escape(run, f, n, onDone) {
    const P = run.P; n = n || CFG.escapeN(run);
    if (f) { f.state = 'grab'; f.gx = (f.x - P.x) * .5; f.gy = (f.y - P.y) * .5; }
    const pp = W.toScreen(P.x, P.y), seq = QTE.spots(n, pp[0] + R(-60, 60), pp[1] + R(-80, 40), false);
    const dur = .62 * n + .9;
    QTE.start(run, { kind: 'escape', mode: 'seq', seq, f, deadline: AU.now() + dur, dur, onDone: onDone || (r => {
      if (f) { f.state = 'wander'; f.cool = 2.5; f.aggro = -4; const a = Math.atan2(f.y - P.y, f.x - P.x); f.vx = Math.cos(a) * 260; f.vy = Math.sin(a) * 260; }
      P.inv = 1.2;
      if (r.ok) { say(run, '挣脱!', '#7aff9a', 1); AU.sfx('bite'); if (f && f.sp.cut) { run.score += 50; floatText(run, P.x, P.y - P.r, '+50 反咬', '#ffe85a', .9); } }
      else { P.inv = 0; hurt(run, 1, 'grab', f); }
    }) });
  },
  mash(run, need, dur, onDone) { QTE.start(run, { kind: 'mash', mode: 'mash', n: 0, need, last: -1, deadline: AU.now() + dur, dur, onDone }); },
  // Boss 反击连段：从弱点开始，一串节拍圈
  combo(run, b, n, onDone) {
    const kinds = []; for (let i = 0; i < n; i++) kinds.push(i > 0 && i % 3 === 2 && rnd() < .6 ? 'hold' : 'tap');
    const w = BOSS.weak(b), wp = W.toScreen(w.x, w.y);
    const notes = QTE.chart(kinds, AU.nextBeat(.5), QTE.spots(n, wp[0], wp[1], true));
    notes[0].onWeak = 1;
    QTE.start(run, { kind: 'combo', mode: 'chart', notes, boss: b, onDone });
  },
};

// ==== boss.js ====
// Boss 战：竞技场 + 按拍推进的状态机（待机 → 预警 → 攻击 → 弱点暴露），弱点触发节拍连段 QTE
const BOSS = {
  start(run, def) {
    const P = run.P;
    const b = { def, id: def.id, hp: def.hp, hpMax: def.hp, cx: clamp(P.x, -CFG.W / 2 + 320, CFG.W / 2 - 320), cy: def.y, x: 0, y: 0, phase: 'intro', pt: 0, pb: AU.beat() + 4, atk: 0, k: 0, bpm: def.bpm, ten: [], hitT: 0, dead: 0, noSpawn: true, pull: null, ink: 0, lunge: null, t: 0 };
    b.x = b.cx; b.y = b.cy - 120; b.aw = 240; b.ah = 300;
    run.boss = b; run.fish = run.fish.filter(f => dist(f.x, f.y, b.cx, b.cy) > 500);
    AU.sfx('boss'); say(run, def.name, '#ff6a7a', 3); run.shake = 1.2; musicFor(run);
  },
  weak(b) { return { x: b.x + b.def.weak[0], y: b.y + b.def.weak[1], r: b.def.weak[2] }; },
  next(b, phase, beats) { b.phase = phase; b.pt = 0; b.pb = Math.ceil(AU.beat() + beats - .01); },
  update(run, dt) {
    const b = run.boss, P = run.P, def = b.def; b.t += dt; b.pt += dt; b.hitT = Math.max(0, b.hitT - dt);
    if (b.dead) { b.dead += dt; if (b.dead > 2.2) { run.boss = null; musicFor(run); } return; }
    // 竞技场限制
    P.x = clamp(P.x, b.cx - b.aw, b.cx + b.aw); P.y = clamp(P.y, b.cy - b.ah, b.cy + b.ah);
    // 本体缓慢游移
    const tx = b.cx + Math.sin(b.t * .35) * 70, ty = b.cy - 150 + Math.sin(b.t * .6) * 24;
    if (!b.lunge) { b.x = lerp(b.x, tx, 1 - Math.exp(-dt * 1.2)); b.y = lerp(b.y, ty, 1 - Math.exp(-dt * 1.2)); }
    const beat = AU.beat();
    if (b.phase === 'intro') { if (beat >= b.pb) BOSS.next(b, 'idle', 2); }
    else if (b.phase === 'idle') { if (beat >= b.pb && !run.qte) { b.atk = def.attacks[b.k++ % def.attacks.length]; BOSS.tele(run, b); } }
    else if (b.phase === 'tele') { BOSS.teleUpd(run, b, dt); if (beat >= b.pb) BOSS.attack(run, b); }
    else if (b.phase === 'atk') { BOSS.atkUpd(run, b, dt); if (beat >= b.pb) { BOSS.clear(run, b); BOSS.next(b, 'expose', b.hp < b.hpMax * .4 ? 3 : 4); say(run, '弱点暴露! 靠近' + def.weakName + '!', '#ffe85a', 1.4); } }
    else if (b.phase === 'expose') { if (beat >= b.pb && !run.qte) BOSS.next(b, 'idle', 1); }
    // 碰撞：本体
    if (!run.qte && !run.over) {
      const d = dist(P.x, P.y, b.x, b.y);
      if (b.phase === 'expose') { const w = BOSS.weak(b); if (dist(P.x, P.y, w.x, w.y) < w.r + P.r) { BOSS.combo(run, b); return; } }
      if (d < def.r * .8 + P.r * .5 && P.inv <= 0) { hurt(run, 1, 'boss'); const a = Math.atan2(P.y - b.y, P.x - b.x); P.vx = Math.cos(a) * 420; P.vy = Math.sin(a) * 420; }
    }
    // 小鱼补给（防饿死）
    if (run.fish.length < 5 && rnd() < dt * 1.2) { const sp = CFG.bossFood(run); const f = mkFish(run, sp, b.cx + R(-1, 1) * b.aw, b.cy + R(-.2, 1) * b.ah, false); f.keep = 1; run.fish.push(f); }
  },
  tele(run, b) {
    const P = run.P; BOSS.next(b, 'tele', b.atk === 'grab' || b.atk === 'suck' ? 1 : 2); b.ten = [];
    if (b.atk === 'slam') { const n = b.hp < b.hpMax * .5 ? 2 : 1; for (let i = 0; i < n; i++) { const ox = b.x + R(-40, 40), oy = b.y + 50; const a = Math.atan2(P.y - oy, P.x - ox) + (i ? R(-.5, .5) : 0); b.ten.push({ k: 'slam', ox, oy, a, len: 560, w: 46, ext: 0 }); } }
    if (b.atk === 'lunge') { const a = Math.atan2(P.y - b.y, P.x - b.x); b.ten.push({ k: 'lane', ox: b.x, oy: b.y, a, len: 520, w: b.def.r * 1.2, ext: 0 }); }
    AU.sfx('tick');
  },
  teleUpd(run, b) { for (const t of b.ten) if (t.k === 'slam' || t.k === 'lane') { t.ox = lerp(t.ox, b.x, .05); } },
  attack(run, b) {
    const P = run.P; BOSS.next(b, 'atk', b.atk === 'suck' || b.atk === 'grab' ? 3 : 2);
    if (b.atk === 'slam') { for (const t of b.ten) t.hit = 0; run.shake = .6; AU.sfx('bite'); }
    if (b.atk === 'grab') { b.ten = [{ k: 'grab', x: b.x, y: b.y + 60, ox: b.x, oy: b.y + 60 }]; }
    if (b.atk === 'ink') { b.ink = 1; for (let i = 0; i < 6; i++) { const f = mkFish(run, CFG.bossFood(run), b.cx + R(-1, 1) * b.aw, b.cy + R(0, 1) * b.ah, false); f.keep = 1; run.fish.push(f); } }
    if (b.atk === 'suck') { b.pull = { x: 0, y: 0 }; say(run, '张口吸入! 快游开!', '#ff6a7a', 1.2); }
    if (b.atk === 'lunge') { const t = b.ten[0]; b.lunge = { a: t.a, t: 0, sx: b.x, sy: b.y }; AU.sfx('dash'); }
  },
  atkUpd(run, b, dt) {
    const P = run.P;
    if (b.atk === 'slam') for (const t of b.ten) {
      t.ext = Math.min(1, t.ext + dt * 4);
      if (!t.hit && t.ext > .6 && P.inv <= 0 && !run.qte) { const dx = P.x - t.ox, dy = P.y - t.oy, along = dx * Math.cos(t.a) + dy * Math.sin(t.a), across = -dx * Math.sin(t.a) + dy * Math.cos(t.a); if (along > 0 && along < t.len * t.ext && Math.abs(across) < t.w / 2 + P.r * .6) { t.hit = 1; hurt(run, 1, 'boss'); } }
    }
    if (b.atk === 'grab') for (const t of b.ten) {
      const a = Math.atan2(P.y - t.y, P.x - t.x), sp = (CFG.baseSpd + P.L * 5) * .95;
      t.x += Math.cos(a) * sp * dt; t.y += Math.sin(a) * sp * dt;
      if (!run.qte && P.inv <= 0 && dist(t.x, t.y, P.x, P.y) < P.r + 14) {
        b.ten = [{ k: 'wrap', x: P.x, y: P.y, ox: b.x, oy: b.y + 60 }];
        QTE.escape(run, null, CFG.escapeN(run) + 1, r => {
          P.inv = 1.2; b.ten = [];
          if (r.ok) { BOSS.damage(run, b, 3, '斩断触手!'); } else { P.inv = 0; hurt(run, 1, 'grab'); }
          if (b.phase === 'atk') b.pb = Math.ceil(AU.beat());
        });
      }
    }
    if (b.atk === 'suck' && b.pull) {
      const mx = b.x, my = b.y + b.def.r * .3, a = Math.atan2(my - P.y, mx - P.x), d = dist(P.x, P.y, mx, my);
      const f = 340 * clamp(1.4 - d / 600, .3, 1.2); b.pull.x = Math.cos(a) * f; b.pull.y = Math.sin(a) * f;
      for (const fi of run.fish) { fi.x += Math.cos(Math.atan2(my - fi.y, mx - fi.x)) * 90 * dt; fi.y += Math.sin(Math.atan2(my - fi.y, mx - fi.x)) * 90 * dt; }
      if (d < b.def.r * .55 && !run.qte) {
        b.pull = null; run.shake = 1;
        if (!run.stomachUsed) {
          run.stomachUsed = true; run.inBelly = 1; say(run, '被吞进肚子! 左右交替狂点!', '#ff6a7a', 1.6);
          QTE.mash(run, 16, 4.2, r => { run.inBelly = 0; P.y = b.y + b.def.r + 60; P.vy = 400; P.inv = 1.5; if (r.ok) BOSS.damage(run, b, 5, '撞破胃壁!'); else { P.inv = 0; hurt(run, 2, 'boss'); } b.pb = Math.ceil(AU.beat()); });
        } else { P.inv = 0; hurt(run, 2, 'boss'); P.y = b.y + b.def.r + 60; P.vy = 420; }
      }
    }
    if (b.lunge) { const L = b.lunge; L.t += dt; const k = L.t < .35 ? easeOut(L.t / .35) : 1 - (L.t - .35) / .8; const len = 440 * clamp(k, 0, 1); b.x = L.sx + Math.cos(L.a) * len; b.y = L.sy + Math.sin(L.a) * len; if (L.t > 1.15) b.lunge = null; }
  },
  clear(run, b) { b.ten = []; b.pull = null; b.ink = 0; b.lunge = null; },
  combo(run, b) {
    const n = b.hp < b.hpMax * .5 ? 7 : 5, P = run.P, w = BOSS.weak(b);
    P.vx = 0; P.vy = 0;
    QTE.combo(run, b, n, r => {
      const dmg = r.P * 2 + r.G + (r.M === 0 ? 3 : 0);
      if (dmg > 0) BOSS.damage(run, b, dmg, r.M === 0 ? '完美连段!' : '连段 ' + (r.P + r.G) + '/' + r.all);
      else say(run, '连段失败', '#ff8a8a', 1);
      const a = Math.atan2(P.y - w.y, P.x - w.x); P.vx = Math.cos(a) * 380; P.vy = Math.sin(a) * 380 + 200; P.inv = 1;
      BOSS.next(b, 'idle', 2);
    });
  },
  damage(run, b, n, msg) {
    b.hp = Math.max(0, b.hp - n); b.hitT = .5; run.shake = .8; AU.sfx('bite');
    run.score += n * 60; floatText(run, b.x, b.y, '-' + n, '#ffe85a', 1.4);
    if (msg) say(run, msg, '#ffe85a', 1.2);
    if (b.hp <= 0 && !b.dead) BOSS.kill(run, b);
  },
  kill(run, b) {
    b.dead = .001; BOSS.clear(run, b); run.qte = null;
    const bonus = b.def.score; run.score += bonus; run.bossGold = (run.bossGold || 0) + b.def.gold;
    run.bossDone[b.id] = 1; G.save.bosses[b.id] = (G.save.bosses[b.id] || 0) + 1;
    const c = G.save.codex[b.id] || (G.save.codex[b.id] = { n: 0, p: 0, g: 0 }); if (!c.n) run.newCodex.push(b.id); c.n++;
    floatText(run, b.x, b.y - 40, '+' + fmt(bonus), '#ffe85a', 1.8); AU.sfx('win'); say(run, '击败 ' + b.def.short + '! 继续下潜', '#7aff9a', 3);
    run.P.hunger = run.P.hungerMax; run.P.hp = Math.min(run.P.hpMax, run.P.hp + 1);
    fxAdd(run, 'boom', b.x, b.y, { r: b.def.r, life: 1.6 });
    for (let i = 0; i < 10; i++) { const f = mkFish(run, CFG.bossFood(run), b.x + R(-120, 120), b.y + R(-80, 120), i === 0); f.keep = 1; run.fish.push(f); }
  },
};

  const tip = CFG.resultTip(r); if (tip) { W.text(x, tip, VW / 2, Math.max(y + 10, VH - 210), 11, '#8ad0ff', { align: 'center' }); }
  const by = VH - 186;

SCR.meta = x => {
  W.bg(x); topBar(x, CFG.metaName);
  const tabs = CFG.metaTabs(), VW = G.VW; SCR.tab = Math.min(SCR.tab, tabs.length - 1);

SCR.codex = x => {
  W.bg(x); const S = G.save, VW = G.VW;

// ==== main.js ====
// 启动与主循环：打开即开局（无封面），首次触摸时开启音频
function frame(ts) {
  const t = ts / 1000, rdt = Math.min(.05, Math.max(0, t - (G.t || t))); G.t = t; G.dt = rdt;
  if (!G.freeze) {
    AU.tick();
    if (G.state === 'play' && !G.paused && G.run) { try { stepRun(G.run, rdt); } catch (e) { console.error(e); } }
  }
  draw();
  requestAnimationFrame(frame);
}
function draw() {
  const x = G.x; UI.begin();
  x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = CFG.letterbox || '#000'; x.fillRect(0, 0, G.cv.width, G.cv.height);
  x.setTransform(G.scale * G.dpr, 0, 0, G.scale * G.dpr, G.ox * G.dpr, G.oy * G.dpr);
  x.save(); x.beginPath(); x.rect(0, 0, G.VW, G.VH); x.clip();
  try {
    if (G.state === 'play' || G.state === 'pause') W.render(x);
    if (G.state === 'pause') SCR.pause(x);
    else if (G.state === 'result') SCR.result(x);
    else if (G.state === 'meta') SCR.meta(x);
    else if (G.state === 'codex') SCR.codex(x);
  } catch (e) { console.error(e); }
  x.restore();
}
function boot() {
  G.cv = document.getElementById('c'); G.x = G.cv.getContext('2d');
  loadSave(); AU.setOn(!!G.save.sound);
  // 调试：?spec=white&gold=9999&depth=1000&L=4
  if (Q.get('spec')) { G.save.spec = Q.get('spec'); G.save.specs[Q.get('spec')] = 1; }
  if (Q.get('gold')) G.save.gold = +Q.get('gold');
  addEventListener('resize', resize); resize();
  inBind(G.cv);
  newRun();
  if (Q.get('depth')) { G.run.P.y = +Q.get('depth') * (CFG.depthScale || 1); G.run.cam.y = G.run.P.y; G.run.fish = []; }
  if (Q.get('L')) G.run.P.L = +Q.get('L');
  if (CFG.debug) CFG.debug(Q);
  window.G = G; window.DONE = true;
  requestAnimationFrame(frame);
}
const _fonts = (CFG.fonts || []).map(f => document.fonts && document.fonts.load('16px ' + f, '鱼').catch(() => { }));
Promise.race([Promise.all(_fonts), new Promise(r => setTimeout(r, 1200))]).then(boot);
