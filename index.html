  if (CFG.hurtTime) { const t = CFG.hurtTime * n; run.timeLeft = Math.max(0, run.timeLeft - t); run.score = Math.max(0, run.score - 50 * n); floatText(run, P.x, P.y - P.r - 10, '-' + t + '秒', '#ff5a5a', 1.2); return; }
  P.hp -= n;
  floatText(run, P.x, P.y - P.r - 10, why === 'starve' ? '饿坏了!' : '-' + n, '#ff5a5a', 1);
  if (P.hp <= 0) { P.hp = 0; endRun(run, why); }
}
function endRun(run, why) { if (run.over) return; run.over = .001; run.why = why; if (run.qte) run.qte = null; AU.sfx(why === 'time' ? 'win' : 'over'); AU.duck(.4); }
// 吞食
function eat(run, f, how) {
  if (run.over || f.dead || CFG.habitable && !CFG.habitable(run, f.x, f.y)) return;
  const P = run.P, sp = f.sp; f.dead = 1;
  const pts = Math.round((sp.pts || (f.tier + 1) * 10) * CFG.ptsMul(run) * (1 + Math.min(2, Math.floor(run.combo / 5) * .2)) * (run.fever > 0 ? 2 : 1) * (how === 'perfect' ? 2 : how === 'qte' ? 1.5 : 1) * (f.gold ? 5 : 1));
  run.score += pts; run.eaten++; run.combo++; run.comboT = 3; run.maxCombo = Math.max(run.maxCombo, run.combo);
  if (CFG.feed) CFG.feed(run, f, how);
  else P.hunger = Math.min(P.hungerMax, P.hunger + (sp.food || 5 + f.tier * 3) * (how !== 'free' ? 1.5 : 1));
  P.mouth = 1;
  if (window.BigFishHost) window.BigFishHost.pulse(how === 'perfect' ? 'success' : 'light');
  if (run.fever <= 0 && CFG.frenzy) { run.frenzy += (4 + f.tier * 1.5 + (how === 'perfect' ? 8 : 0)) * (run.frenzyMul || 1); if (run.frenzy >= 100) { run.frenzy = 0; startFever(run, 8 + (CFG.feverPlus ? CFG.feverPlus() : 0)); } }
  // 经验与成长
  if (P.L < CFG.maxL(P, run)) {
    P.xp += (f.tier + 1) * (how !== 'free' ? 2 : 1) * (f.gold ? 3 : 1);
    const need = CFG.xpNeed(P.L);
    if (P.xp >= need) { P.xp -= need; P.L++; P.growT = 1.2; AU.sfx('grow'); say(run, CFG.growMsg(P.L), '#7aff9a', 2); fxAdd(run, 'grow', P.x, P.y, { life: 1 }); }
  }
  // 图鉴
  const c = G.save.codex[sp.id] || (G.save.codex[sp.id] = { n: 0, p: 0, g: 0 });
  if (!c.n) run.newCodex.push(sp.id);
  c.n++; if (how === 'perfect') c.p++;
  if (f.gold) { if (!c.g) run.newCodex.push(sp.id + '*'); c.g++; run.goldFish++; say(run, '★ 金色' + sp.name + ' 收录!', '#ffd23a', 2.4); AU.sfx('coin'); }
  else if (c.n === 1) say(run, 'NEW! ' + sp.name + ' 收录', '#ffe060', 1.8);
  G.save.eatTotal++;
  AU.sfx(f.tier >= P.L - 1 ? 'gulpBig' : 'gulp', Math.min(8, run.combo));
  floatText(run, f.x, f.y - f.r, '+' + pts, f.gold ? '#ffd23a' : '#ffe85a', pts >= 200 ? 1.2 : .8);
  fxAdd(run, 'gulp', f.x, f.y, { r: f.r, col: sp.col || '#fff', life: .45 });
  CFG.onEat && CFG.onEat(run, f, how);
}
function startFever(run, t) { run.fever = t; run.feverN++; AU.mode = 'fever'; AU.sfx('perfect'); say(run, CFG.feverMsg || 'FEVER!', '#ff8af0', 1.8); musicFor(run); }
// 转身：face 从 +1 线性翻到 -1（约 0.22 秒），渲染时按 |face| 横向压扁，过 0 时换朝向
function turnStep(o, dt) { if (o.face == null) o.face = o.dir; const t = o.dir; if (o.face !== t) { const st = dt * 9; o.face = Math.abs(t - o.face) <= st ? t : o.face + Math.sign(t - o.face) * st; } }
// 音乐跟随区域/状态
function musicFor(run, first) {
  const Z = CFG.ZONES[run.zone] || CFG.ZONES[0];
  let bpm = Z.bpm, mode = 'normal', int = Z.int;
  if (CFG.musicMod) { const m = CFG.musicMod(run); bpm = m.bpm || bpm; int = m.int != null ? m.int : int; }
  if (run.boss) { bpm = run.boss.bpm; mode = 'boss'; int = 3; }
  if (run.fever > 0) mode = 'fever';
  if (run.qte) mode = 'qte';
  const newStyle = run.boss ? (CFG.bossStyle || Z.style) : Z.style;
  if (AU.style !== newStyle) { AU.style = newStyle; AU.sect = (AU.sect + 1) % 4; }
  AU.mode = mode; AU.int = int; AU.setBpm(bpm); AU.duck(run.qte ? .75 : 1);
}
// 结算
function toResult(run) {
  const S = G.save;
  const gold = Math.floor(run.score / CFG.goldDiv) + run.goldFish * 20 + (run.bossGold || 0);
  const gm = Math.round(gold * (1 + (CFG.goldBonus ? CFG.goldBonus() : 0)));
  run.gold = gm; S.gold += gm; S.runs++;
  run.newBest = run.score > S.best.score;
  S.best.score = Math.max(S.best.score, Math.floor(run.score)); S.best.depth = Math.max(S.best.depth, Math.floor(run.maxDepth)); S.best.combo = Math.max(S.best.combo, run.maxCombo);
  if (run.hintT <= 0) S.hinted = Math.max(S.hinted, 1); S.hinted++;
  run.unlocks = CFG.checkUnlocks ? CFG.checkUnlocks(run) : [];
  saveNow();
  G.state = 'result'; UI.scroll = 0; AU.mode = 'normal'; AU.int = 0; AU.duck(.5);
}

// ==== qte.js ====
// QTE（全触屏）：节拍圈（点/按住，卡在拍点上，圈出现在屏幕不同位置）+ 按序点结（挣脱）+ 左右连点（腹中逃脱）
// 判定时间一律用 AU.now()（音频时钟），画面的子弹时间只影响世界运动；坐标是屏幕逻辑坐标（390 宽）
const QTE = {
  HIT: 58,               // 点圈的有效半径（手指友好）
  win() { const b = stat('bite') * .006; return { P: .075 + b, G: .155 + b, early: .26 }; },
  start(run, q) {
    q.t0 = AU.now(); q.i = 0; q.res = []; q.hold = null; q.done = false;
    run.qte = q; IN.joy = null; AU.sfx('qte'); musicFor(run);
  },
  finish(run, ok) {
    const q = run.qte; if (!q || q.done) return; q.done = true;
    const P = q.res.filter(r => r === 'P').length, Gd = q.res.filter(r => r === 'G').length, M = q.res.filter(r => r === 'M').length;
    run.qte = null; run.lock = .5; musicFor(run);
    q.onDone({ ok, P, G: Gd, M, n: q.res.length, all: q.notes ? q.notes.length : q.seq ? q.seq.length : 0 });
  },
  judge(q, r, note) {
    q.res.push(r); note.res = r; note.jt = AU.now(); const p = QTE.pos(note); note.jx = p[0]; note.jy = p[1];
    if (r === 'P') AU.sfx('perfect'); else if (r === 'G') AU.sfx('good'); else AU.sfx('miss');
    if (r === 'P' && G.run) G.run.perfects++;
  },
  // 音符当前位置：跟着猎物/Boss 弱点走，否则是固定屏幕点
  pos(n) {
    if (n.onFish) return W.toScreen(n.onFish.x, n.onFish.y);
    if (n.onWeak && G.run && G.run.boss) { const w = BOSS.weak(G.run.boss); return W.toScreen(w.x, w.y); }
    return [n.x, n.y];
  },
  // —— 输入 ——
  input(e) {
    const run = G.run, q = run && run.qte; if (!q || q.done) return;
    if (q.mode === 'seq') {
      if (e.k !== 'down') return;
      const hit = q.seq.findIndex((s, i) => i >= q.i && dist(e.x, e.y, s.x, s.y) < QTE.HIT);
      if (hit === q.i) { q.res.push('P'); q.seq[q.i].done = AU.now(); q.i++; AU.sfx('swipe', q.i); if (q.i >= q.seq.length) QTE.finish(run, true); }
      else if (hit > q.i) { q.res.push('M'); q.wrong = AU.now(); q.wrongI = hit; q.deadline -= .35; AU.sfx('miss'); }
      return;
    }
    if (q.mode === 'mash') {
      if (e.k !== 'down') return;
      const side = e.x < G.VW / 2 ? 0 : 1;
      if (side !== q.last) { q.n++; q.last = side; AU.sfx('tick'); if (q.n >= q.need) QTE.finish(run, true); }
      return;
    }
    // chart：只认按在当前音符圈里的触摸
    const W2 = QTE.win(), note = q.notes[q.i]; if (!note) return;
    if (e.k === 'up') {
      if (q.hold === note && q.holdId === e.id) {
        const dt = e.t - note.end;
        QTE.judge(q, dt < -W2.G ? 'G' : (note.hr === 'P' && Math.abs(dt) <= W2.P * 1.5 ? 'P' : 'G'), note);
        q.hold = null; q.i++; QTE.after(run, q);
      }
      return;
    }
    const p = QTE.pos(note);
    if (dist(e.x, e.y, p[0], p[1]) > QTE.HIT) { q.offTap = { x: e.x, y: e.y, t: AU.now() }; return; }
    const dt = e.t - note.t;
    if (dt < -W2.early) return;
    const r = Math.abs(dt) <= W2.P ? 'P' : Math.abs(dt) <= W2.G ? 'G' : 'M';
    if (note.k === 'hold' && r !== 'M') { note.hr = r; q.hold = note; q.holdId = e.id; note.held = AU.now(); AU.sfx(r === 'P' ? 'perfect' : 'good'); return; }
    QTE.judge(q, r, note); q.i++; QTE.after(run, q);
  },
  after(run, q) { if (q.i >= q.notes.length) setTimeout(() => { if (run.qte === q) QTE.finish(run, true); }, 0); },
  update() {
    const run = G.run, q = run && run.qte; if (!q || q.done) return;
    const now = AU.now();
    if (q.mode === 'seq' || q.mode === 'mash') { if (now > q.deadline) QTE.finish(run, false); return; }
    const W2 = QTE.win(), note = q.notes[q.i]; if (!note) { QTE.finish(run, true); return; }
    if (q.hold === note) { if (now > note.end + W2.G) { QTE.judge(q, note.hr, note); q.hold = null; q.i++; QTE.after(run, q); } return; }
    if (now > note.t + W2.G) { QTE.judge(q, 'M', note); q.i++; if (q.failFast && q.res[0] === 'M') { QTE.finish(run, false); return; } QTE.after(run, q); }
  },
  // —— 生成：拍点 + 屏幕位置 ——
  // 从 (cx,cy) 附近开始，每个点离上一个 85~125px，落在屏幕安全区里
  spots(n, cx, cy, first) {
    const out = [], x0 = 54, x1 = G.VW - 54, y0 = 150, y1 = G.VH - 190;
    let px = clamp(cx, x0, x1), py = clamp(cy, y0, y1), a = rnd() * 6.28;
    for (let i = 0; i < n; i++) {
      if (i > 0 || !first) {
        let tries = 0, nx, ny;
        do { a += R(.9, 2.2) * (rnd() < .5 ? -1 : 1); const d = R(85, 125); nx = px + Math.cos(a) * d; ny = py + Math.sin(a) * d; tries++; }
        while (tries < 12 && (nx < x0 || nx > x1 || ny < y0 || ny > y1 || out.some(o => dist(o.x, o.y, nx, ny) < 70)));
        px = clamp(nx, x0, x1); py = clamp(ny, y0, y1);
      }
      out.push({ x: px, y: py });
    }
    return out;
  },
  chart(kinds, start, pts) {
    const out = []; let b = AU.beat(start);
    kinds.forEach((k, i) => {
      const t = AU.beatTime(b), n = { k, t, x: pts[i].x, y: pts[i].y, num: i + 1 };
      if (k === 'hold') { n.end = AU.beatTime(b + 1); b += 1; }
      out.push(n); b += 1;
    });
    return out;
  },
  // —— 具体 QTE ——
  // 撕咬：第一拍点在猎物身上；更大的猎物还要按拍点它周围冒出的圈（甩头）
  bite(run, f) {
    const P = run.P; f.state = 'grab'; f.gx = (f.x - P.x) * .6; f.gy = (f.y - P.y) * .6; run.bites++;
    const big = f.tier > P.L - (run.fever > 0 ? 1 : 0);
    const n = 1 + (big ? CFG.thrashN(run) : 0), kinds = ['tap'];
    for (let i = 1; i < n; i++) kinds.push(i === n - 1 && n >= 4 && rnd() < .5 ? 'hold' : 'tap');
    const fp = W.toScreen(f.x, f.y), notes = QTE.chart(kinds, AU.nextBeat(CFG.biteLead || .5), QTE.spots(n, fp[0], fp[1], true));
    notes[0].onFish = f;
    QTE.start(run, { kind: 'bite', mode: 'chart', notes, f, big, failFast: true, onDone: r => {
      if (r.ok && r.M <= (big ? 1 : 0) && r.n > 0) {
        const perfect = r.M === 0 && r.G === 0;
        P.mouth = 1; AU.sfx('bite'); run.shake = .5;
        if (f.hp > 1) { f.hp--; f.state = 'wander'; f.cool = 1.2; f.aggro = -2; const a = Math.atan2(f.y - P.y, f.x - P.x); f.vx = Math.cos(a) * 400; f.vy = Math.sin(a) * 400; floatText(run, f.x, f.y - f.r, '咬中! 还剩' + f.hp, '#ffd23a', 1); }
        else eat(run, f, perfect ? 'perfect' : 'qte');
        say(run, perfect ? 'PERFECT 一口吞!' : big ? '撕咬成功!' : '吞下!', perfect ? '#ffe85a' : '#7aff9a', 1.1);
      } else {
        f.state = 'wander'; f.cool = 2; f.aggro = -2;
        const a = Math.atan2(P.y - f.y, P.x - f.x); P.vx = Math.cos(a) * 320; P.vy = Math.sin(a) * 320;
        f.vx = -Math.cos(a) * 300; f.vy = -Math.sin(a) * 300;
        if (big) hurt(run, 1, 'bite', f); else { if (CFG.hunger) P.hunger = Math.max(0, P.hunger - 6); floatText(run, P.x, P.y - P.r, '被弹开', '#ff8a8a', .9); }
        run.combo = 0; run.comboT = 0;
      }
    } });
  },
  // 挣脱：缠在身上的结按 1→n 依次点掉
  escape(run, f, n, onDone) {
    const P = run.P; n = n || CFG.escapeN(run);
    if (f) { f.state = 'grab'; f.gx = (f.x - P.x) * .5; f.gy = (f.y - P.y) * .5; }
    const pp = W.toScreen(P.x, P.y), seq = QTE.spots(n, pp[0] + R(-60, 60), pp[1] + R(-80, 40), false);
    const dur = .62 * n + .9;
    QTE.start(run, { kind: 'escape', mode: 'seq', seq, f, deadline: AU.now() + dur, dur, onDone: onDone || (r => {
      if (f) { f.state = 'wander'; f.cool = 2.5; f.aggro = -4; const a = Math.atan2(f.y - P.y, f.x - P.x); f.vx = Math.cos(a) * 260; f.vy = Math.sin(a) * 260; }
      P.inv = 1.2;
      if (r.ok) { say(run, '挣脱!', '#7aff9a', 1); AU.sfx('bite'); if (f && f.sp.cut) { run.score += 50; floatText(run, P.x, P.y - P.r, '+50 反咬', '#ffe85a', .9); } }
      else { P.inv = 0; hurt(run, 1, 'grab', f); }
    }) });
  },
  mash(run, need, dur, onDone) { QTE.start(run, { kind: 'mash', mode: 'mash', n: 0, need, last: -1, deadline: AU.now() + dur, dur, onDone }); },
  // Boss 反击连段：从弱点开始，一串节拍圈
  combo(run, b, n, onDone) {
    const kinds = []; for (let i = 0; i < n; i++) kinds.push(i > 0 && i % 3 === 2 && rnd() < .6 ? 'hold' : 'tap');
    const w = BOSS.weak(b), wp = W.toScreen(w.x, w.y);
    const notes = QTE.chart(kinds, AU.nextBeat(.5), QTE.spots(n, wp[0], wp[1], true));
    notes[0].onWeak = 1;
    QTE.start(run, { kind: 'combo', mode: 'chart', notes, boss: b, onDone });
  },
};

// ==== boss.js ====
// Boss 战：竞技场 + 按拍推进的状态机（待机 → 预警 → 攻击 → 弱点暴露），弱点触发节拍连段 QTE
const BOSS = {
  start(run, def) {
    const P = run.P;
    const b = { def, id: def.id, hp: def.hp, hpMax: def.hp, cx: clamp(P.x, -CFG.W / 2 + 320, CFG.W / 2 - 320), cy: def.y, x: 0, y: 0, phase: 'intro', pt: 0, pb: AU.beat() + 4, atk: 0, k: 0, bpm: def.bpm, ten: [], hitT: 0, dead: 0, noSpawn: true, pull: null, ink: 0, lunge: null, t: 0 };
    b.x = b.cx; b.y = b.cy - 120; b.aw = 240; b.ah = 300;
    run.boss = b; run.fish = run.fish.filter(f => dist(f.x, f.y, b.cx, b.cy) > 500);
    AU.sfx('boss'); say(run, def.name, '#ff6a7a', 3); run.shake = 1.2; musicFor(run);
  },
  weak(b) { return { x: b.x + b.def.weak[0], y: b.y + b.def.weak[1], r: b.def.weak[2] }; },
  next(b, phase, beats) { b.phase = phase; b.pt = 0; b.pb = Math.ceil(AU.beat() + beats - .01); },
  update(run, dt) {
    const b = run.boss, P = run.P, def = b.def; b.t += dt; b.pt += dt; b.hitT = Math.max(0, b.hitT - dt);
    if (b.dead) { b.dead += dt; if (b.dead > 2.2) { run.boss = null; musicFor(run); } return; }
    // 竞技场限制
    P.x = clamp(P.x, b.cx - b.aw, b.cx + b.aw); P.y = clamp(P.y, b.cy - b.ah, b.cy + b.ah);
    // 本体缓慢游移
    const tx = b.cx + Math.sin(b.t * .35) * 70, ty = b.cy - 150 + Math.sin(b.t * .6) * 24;
    if (!b.lunge) { b.x = lerp(b.x, tx, 1 - Math.exp(-dt * 1.2)); b.y = lerp(b.y, ty, 1 - Math.exp(-dt * 1.2)); }
    const beat = AU.beat();
    if (b.phase === 'intro') { if (beat >= b.pb) BOSS.next(b, 'idle', 2); }
    else if (b.phase === 'idle') { if (beat >= b.pb && !run.qte) { b.atk = def.attacks[b.k++ % def.attacks.length]; BOSS.tele(run, b); } }
    else if (b.phase === 'tele') { BOSS.teleUpd(run, b, dt); if (beat >= b.pb) BOSS.attack(run, b); }
    else if (b.phase === 'atk') { BOSS.atkUpd(run, b, dt); if (beat >= b.pb) { BOSS.clear(run, b); BOSS.next(b, 'expose', b.hp < b.hpMax * .4 ? 3 : 4); say(run, '弱点暴露! 靠近' + def.weakName + '!', '#ffe85a', 1.4); } }
    else if (b.phase === 'expose') { if (beat >= b.pb && !run.qte) BOSS.next(b, 'idle', 1); }
    // 碰撞：本体
    if (!run.qte && !run.over) {
      const d = dist(P.x, P.y, b.x, b.y);
      if (b.phase === 'expose') { const w = BOSS.weak(b); if (dist(P.x, P.y, w.x, w.y) < w.r + P.r) { BOSS.combo(run, b); return; } }
      if (d < def.r * .8 + P.r * .5 && P.inv <= 0) { hurt(run, 1, 'boss'); const a = Math.atan2(P.y - b.y, P.x - b.x); P.vx = Math.cos(a) * 420; P.vy = Math.sin(a) * 420; }
    }
    // 小鱼补给（防饿死）
    if (run.fish.length < 5 && rnd() < dt * 1.2) { const sp = CFG.bossFood(run); const f = mkFish(run, sp, b.cx + R(-1, 1) * b.aw, b.cy + R(-.2, 1) * b.ah, false); f.keep = 1; run.fish.push(f); }
  },
  tele(run, b) {
    const P = run.P; BOSS.next(b, 'tele', b.atk === 'grab' || b.atk === 'suck' ? 1 : 2); b.ten = [];
    if (b.atk === 'slam') { const n = b.hp < b.hpMax * .5 ? 2 : 1; for (let i = 0; i < n; i++) { const ox = b.x + R(-40, 40), oy = b.y + 50; const a = Math.atan2(P.y - oy, P.x - ox) + (i ? R(-.5, .5) : 0); b.ten.push({ k: 'slam', ox, oy, a, len: 560, w: 46, ext: 0 }); } }
    if (b.atk === 'lunge') { const a = Math.atan2(P.y - b.y, P.x - b.x); b.ten.push({ k: 'lane', ox: b.x, oy: b.y, a, len: 520, w: b.def.r * 1.2, ext: 0 }); }
    AU.sfx('tick');
  },
  teleUpd(run, b) { for (const t of b.ten) if (t.k === 'slam' || t.k === 'lane') { t.ox = lerp(t.ox, b.x, .05); } },
  attack(run, b) {
    const P = run.P; BOSS.next(b, 'atk', b.atk === 'suck' || b.atk === 'grab' ? 3 : 2);
    if (b.atk === 'slam') { for (const t of b.ten) t.hit = 0; run.shake = .6; AU.sfx('bite'); }
    if (b.atk === 'grab') { b.ten = [{ k: 'grab', x: b.x, y: b.y + 60, ox: b.x, oy: b.y + 60 }]; }
    if (b.atk === 'ink') { b.ink = 1; for (let i = 0; i < 6; i++) { const f = mkFish(run, CFG.bossFood(run), b.cx + R(-1, 1) * b.aw, b.cy + R(0, 1) * b.ah, false); f.keep = 1; run.fish.push(f); } }
    if (b.atk === 'suck') { b.pull = { x: 0, y: 0 }; say(run, '张口吸入! 快游开!', '#ff6a7a', 1.2); }
    if (b.atk === 'lunge') { const t = b.ten[0]; b.lunge = { a: t.a, t: 0, sx: b.x, sy: b.y }; AU.sfx('dash'); }
  },
  atkUpd(run, b, dt) {
    const P = run.P;
    if (b.atk === 'slam') for (const t of b.ten) {
      t.ext = Math.min(1, t.ext + dt * 4);
      if (!t.hit && t.ext > .6 && P.inv <= 0 && !run.qte) { const dx = P.x - t.ox, dy = P.y - t.oy, along = dx * Math.cos(t.a) + dy * Math.sin(t.a), across = -dx * Math.sin(t.a) + dy * Math.cos(t.a); if (along > 0 && along < t.len * t.ext && Math.abs(across) < t.w / 2 + P.r * .6) { t.hit = 1; hurt(run, 1, 'boss'); } }
    }
    if (b.atk === 'grab') for (const t of b.ten) {
      const a = Math.atan2(P.y - t.y, P.x - t.x), sp = (CFG.baseSpd + P.L * 5) * .95;
      t.x += Math.cos(a) * sp * dt; t.y += Math.sin(a) * sp * dt;
      if (!run.qte && P.inv <= 0 && dist(t.x, t.y, P.x, P.y) < P.r + 14) {
        b.ten = [{ k: 'wrap', x: P.x, y: P.y, ox: b.x, oy: b.y + 60 }];
        QTE.escape(run, null, CFG.escapeN(run) + 1, r => {
          P.inv = 1.2; b.ten = [];
          if (r.ok) { BOSS.damage(run, b, 3, '斩断触手!'); } else { P.inv = 0; hurt(run, 1, 'grab'); }
          if (b.phase === 'atk') b.pb = Math.ceil(AU.beat());
        });
      }
    }
    if (b.atk === 'suck' && b.pull) {
      const mx = b.x, my = b.y + b.def.r * .3, a = Math.atan2(my - P.y, mx - P.x), d = dist(P.x, P.y, mx, my);
      const f = 340 * clamp(1.4 - d / 600, .3, 1.2); b.pull.x = Math.cos(a) * f; b.pull.y = Math.sin(a) * f;
      for (const fi of run.fish) { fi.x += Math.cos(Math.atan2(my - fi.y, mx - fi.x)) * 90 * dt; fi.y += Math.sin(Math.atan2(my - fi.y, mx - fi.x)) * 90 * dt; }
      if (d < b.def.r * .55 && !run.qte) {
        b.pull = null; run.shake = 1;
        if (!run.stomachUsed) {
          run.stomachUsed = true; run.inBelly = 1; say(run, '被吞进肚子! 左右交替狂点!', '#ff6a7a', 1.6);
          QTE.mash(run, 16, 4.2, r => { run.inBelly = 0; P.y = b.y + b.def.r + 60; P.vy = 400; P.inv = 1.5; if (r.ok) BOSS.damage(run, b, 5, '撞破胃壁!'); else { P.inv = 0; hurt(run, 2, 'boss'); } b.pb = Math.ceil(AU.beat()); });
        } else { P.inv = 0; hurt(run, 2, 'boss'); P.y = b.y + b.def.r + 60; P.vy = 420; }
      }
    }
    if (b.lunge) { const L = b.lunge; L.t += dt; const k = L.t < .35 ? easeOut(L.t / .35) : 1 - (L.t - .35) / .8; const len = 440 * clamp(k, 0, 1); b.x = L.sx + Math.cos(L.a) * len; b.y = L.sy + Math.sin(L.a) * len; if (L.t > 1.15) b.lunge = null; }
  },
  clear(run, b) { b.ten = []; b.pull = null; b.ink = 0; b.lunge = null; },
  combo(run, b) {
    const n = b.hp < b.hpMax * .5 ? 7 : 5, P = run.P, w = BOSS.weak(b);
    P.vx = 0; P.vy = 0;
    QTE.combo(run, b, n, r => {
      const dmg = r.P * 2 + r.G + (r.M === 0 ? 3 : 0);
      if (dmg > 0) BOSS.damage(run, b, dmg, r.M === 0 ? '完美连段!' : '连段 ' + (r.P + r.G) + '/' + r.all);
      else say(run, '连段失败', '#ff8a8a', 1);
      const a = Math.atan2(P.y - w.y, P.x - w.x); P.vx = Math.cos(a) * 380; P.vy = Math.sin(a) * 380 + 200; P.inv = 1;
      BOSS.next(b, 'idle', 2);
    });
  },
  damage(run, b, n, msg) {
    b.hp = Math.max(0, b.hp - n); b.hitT = .5; run.shake = .8; AU.sfx('bite');
    run.score += n * 60; floatText(run, b.x, b.y, '-' + n, '#ffe85a', 1.4);
    if (msg) say(run, msg, '#ffe85a', 1.2);
    if (b.hp <= 0 && !b.dead) BOSS.kill(run, b);
  },
  kill(run, b) {
    b.dead = .001; BOSS.clear(run, b); run.qte = null;
    const bonus = b.def.score; run.score += bonus; run.bossGold = (run.bossGold || 0) + b.def.gold;
    run.bossDone[b.id] = 1; G.save.bosses[b.id] = (G.save.bosses[b.id] || 0) + 1;
    const c = G.save.codex[b.id] || (G.save.codex[b.id] = { n: 0, p: 0, g: 0 }); if (!c.n) run.newCodex.push(b.id); c.n++;
    floatText(run, b.x, b.y - 40, '+' + fmt(bonus), '#ffe85a', 1.8); AU.sfx('win'); say(run, '击败 ' + b.def.short + '! 继续下潜', '#7aff9a', 3);
    run.P.hunger = run.P.hungerMax; run.P.hp = Math.min(run.P.hpMax, run.P.hp + 1);
    fxAdd(run, 'boom', b.x, b.y, { r: b.def.r, life: 1.6 });
    for (let i = 0; i < 10; i++) { const f = mkFish(run, CFG.bossFood(run), b.x + R(-120, 120), b.y + R(-80, 120), i === 0); f.keep = 1; run.fish.push(f); }
  },
};

        const startFront = Math.max(ZONES[layer.zone].from, Math.min(layer.lastDepth - 90, next.from - 120));
        layer.storm = { elapsed: 0, startFront, front: ZONES[layer.zone].from, damageT: 0 };
        if (active) { say(run, '本层氧气耗尽 · 缺氧潮将至，向下寻找新水域!', '#ffbb80', 4); AU.sfx('boss'); }
      } else if (layer.storm) layer.storm.elapsed += delta;
      if (layer.storm) layer.storm.front = Math.min(next.from + 24, layer.storm.startFront + Math.max(0, layer.storm.elapsed - Layers.warningTime) * (18 + layer.zone * 3));
    }
  },
  oxygenFront(run) {
    let front = -Infinity;
    for (const layer of run.layers || []) if (layer.storm && layer.storm.elapsed >= Layers.warningTime) front = Math.max(front, layer.storm.front * M2Y);
    return front;
  },
  habitable(run, x, y) { return y > Layers.oxygenFront(run); },
  expire(run, f) {
    if (!f.dead) { f.dead = 1; fxAdd(run, 'oxygen', f.x, f.y, { r: f.r, life: .7 }); }
  },
  clearWater(run) {
    if (!Number.isFinite(Layers.oxygenFront(run))) return;
    for (const f of run.fish) if (!Layers.habitable(run, f.x, f.y)) Layers.expire(run, f);
    run.fish = run.fish.filter(f => !f.dead);
  },
  pool(zone) { return SPECIES.filter(s => s.large && s.layer === zone); },
  forage(run, species) {
    return Object.assign({}, species, { tier: Math.min(species.tier, run.P.L), r: Math.min(tierR(species.tier), run.P.r * .78), hp: 1 });
  },
  huntMotion(run, f, dt) {
    const P = run.P, zone = f.homeZone, age = f.huntAge = (f.huntAge || 0) + dt;
    const cycle = age % (zone === 5 ? 3.6 : zone === 6 ? 5 : zone === 7 ? 4.2 : 6);
    let speed = CFG.pursuitSpeed(run), x = P.x - f.x, y = P.y - f.y;
    if (zone === 5) { speed *= cycle < .7 ? .72 : cycle < 2.1 ? 1.08 : .68; f.state = cycle < .7 ? 'tele' : 'hunt'; }
    if (zone === 6) { x += P.vx * .65; y += Math.sin(age * 1.4 + f.id) * 130; speed *= cycle < 3.5 ? 1.02 : .74; f.state = 'hunt'; }
    if (zone === 7) { x += Math.sin(age * 2.2) * 90; speed *= cycle < .8 ? .68 : cycle < 2.6 ? 1.1 : .76; f.state = cycle < .8 ? 'tele' : 'hunt'; }
    if (zone >= 8) { x += P.vx * .8; y += P.vy * .8; speed *= cycle < 4.5 ? 1.04 : .82; f.state = 'hunt'; }
    return { x, y, speed: Math.min(speed, (CFG.baseSpd + P.L * 6) * stat('spd') * 1.79) };
  },
  residentSpecies(run, species) {
    return Object.assign({}, species, { tier: Math.max(species.tier, run.P.L + 3), r: Math.max(tierR(species.tier), run.P.r * 1.3) });
  },
  spawnMargin(species, radius) {
    const sp = species.ref || species;
    return Math.max(28, (radius || sp.r || tierR(sp.tier)) * 3 + 24);
  },
  offscreen(run, x, y, margin) {
    const hw = G.VW / 2 / run.zoom, hh = G.VH / 2 / run.zoom;
    return Math.abs(x - run.cam.x) > hw + margin || Math.abs(y - run.cam.y) > hh + margin;
  },
  outside(run, species, angle, margin = Layers.spawnMargin(species)) {
    const P = run.P, hw = G.VW / 2 / run.zoom, hh = G.VH / 2 / run.zoom;
    // Spawn beyond both the actual camera and the player, including the whole sprite.
    // Clamping near a wall or biome boundary must never pull a new fish into view.
    const left = Math.min(run.cam.x, P.x) - hw - margin - 20;
    const right = Math.max(run.cam.x, P.x) + hw + margin + 20;
    const top = Math.min(run.cam.y, P.y) - hh - margin - 20;
    const bottom = Math.max(run.cam.y, P.y) + hh + margin + 20;
    const offsets = [0, Math.PI / 2, -Math.PI / 2, Math.PI, ...Array.from({ length: 16 }, (_, i) => i * Math.PI / 8)];
    for (const offset of offsets) {
      const a = angle + offset, dx = Math.cos(a), dy = Math.sin(a);
      const tx = Math.abs(dx) < 1e-6 ? Infinity : ((dx > 0 ? right : left) - P.x) / dx;
      const ty = Math.abs(dy) < 1e-6 ? Infinity : ((dy > 0 ? bottom : top) - P.y) / dy;
      const reach = Math.min(tx, ty);
      const c = CFG.clampSpawn(P.x + dx * reach, P.y + dy * reach, species);
      if (Layers.habitable(run, c[0], c[1]) && Layers.offscreen(run, c[0], c[1], margin) && dist(c[0], c[1], P.x, P.y) > Math.max(160, P.r * 3)) return c;
    }
    // If no legal edge is available, defer the spawn instead of showing a teleport.
    return null;
  },
  enter(run, f) {
    const a = Math.atan2(run.P.y - f.y, run.P.x - f.x), speed = f.sp.spd * 30;
    f.vx = Math.cos(a) * speed; f.vy = Math.sin(a) * speed;
    f.face = f.dir = f.vx >= 0 ? 1 : -1;
    f.ang = clamp(Math.atan2(f.vy, Math.abs(f.vx)), -.8, .8);
    f.wx = run.P.x; f.wy = run.P.y;
    return f;
  },
  supplies(run, species, count) {
    const c = Layers.outside(run, species, R(0, Math.PI * 2), Layers.spawnMargin(species) + 40);
    if (!c) return;
    for (let i = 0; i < count; i++) {
      const pos = CFG.clampSpawn(c[0] + R(-22, 22), c[1] + R(-22, 22), species);
      const f = mkFish(run, species, pos[0], pos[1], false);
      if (Layers.offscreen(run, f.x, f.y, Layers.spawnMargin(species, f.r))) run.fish.push(Layers.enter(run, f));
    }
  },
  spawnHunters(run, h) {
    const source = Layers.pool(h.zone), count = h.level >= 5 ? 3 : h.level >= 2 ? 2 : 1;
    const P = run.P, moving = Math.hypot(P.vx, P.vy) > 20;
    const behind = (moving ? Math.atan2(P.vy, P.vx) : P.dir < 0 ? Math.PI : 0) + Math.PI;
    const chaseScale = 38 * (1 + CFG.diff(run) * .16) * 1.25 * CFG.huntMul(run);
    for (let i = 0; i < count; i++) {
      const base = source[(h.wave + i) % source.length];
      // Wave predators live in their own biome, never in another layer's global species pool.
      const sp = Object.assign({}, base, { r: Math.max(tierR(base.tier), P.r * (1.2 + h.zone * .025)), tier: Math.max(base.tier, P.L + 3), chase: h.left + 2, spd: CFG.pursuitSpeed(run) / chaseScale, beh: 'hunter' });
      const c = Layers.outside(run, sp, behind + (i - (count - 1) / 2) * .65);
      if (!c) continue;
      const f = mkFish(run, sp, c[0], c[1], false);
      f.r = Math.max(tierR(base.tier), P.r * (1.2 + h.zone * .025));
      const aim = Math.atan2(P.y - f.y, P.x - f.x), speed = CFG.pursuitSpeed(run);
      f.vx = Math.cos(aim) * speed; f.vy = Math.sin(aim) * speed;
      f.face = f.dir = f.vx >= 0 ? 1 : -1; f.ang = clamp(Math.atan2(f.vy, Math.abs(f.vx)), -.8, .8);
      f.eventHunter = true; f.homeZone = h.zone; f.layerResident = false; f.state = 'hunt'; run.fish.push(f);
    }
  },
  update(run, dt, oxygenDt = dt) {
    const previous = run.layers[run.layerZone];
    // Attribute score to the layer where it was earned, before switching the active state.
    previous.score += Math.max(0, run.score - run.scoreCheckpoint); run.scoreCheckpoint = run.score;
    const zone = CFG.zoneOf(run); run.zone = zone;
    if (zone !== run.layerZone) {
      for (const f of run.fish) if (f.eventHunter || f.layerResident) { f.retreat = true; f.state = 'wander'; f.aggro = -100; f.cool = Math.max(.2, f.cool); }
      const next = run.layers[zone];
      if (next.phase === 'hunt') { next.resumeLeft = next.left; next.phase = 'warning'; next.left = 2; }
      else if (next.phase === 'warning') next.left = Math.max(2, next.left);
      next.entryGrace = 3;
      if (!next.visited) { next.visited = true; next.anchorDepth = run.depth; }
      if (next.storm) { next.storm.damageT = 0; say(run, '返回危险水域 · 立即下潜', '#ffba8a', 2.5); }
      run.layerZone = zone; run.pursuit = next;
    }
    const h = run.pursuit;
    run.deepestLayer = Math.max(run.deepestLayer, zone); h.lastDepth = run.depth;
    run.tideDanger = false;
    Layers.clearWater(run);
    if (run.over || run.qte || run.boss) return h;
    h.entryGrace = Math.max(0, h.entryGrace - dt); h.time += dt; h.residence += dt;
    if (Math.abs(run.depth - h.anchorDepth) >= 90) { h.anchorDepth = run.depth; h.residence = Math.max(0, h.residence - 35); }
    h.level = Math.min(7, 1 + Math.floor(h.time / 55) + Math.floor(h.residence / 45) + Math.floor(zone / 2));
    const next = ZONES[zone + 1];
    Layers.advanceOxygen(run, oxygenDt);
    if (!h.storm && next) { const left = Layers.remaining(h); if (left <= 10 && Math.ceil(left) !== h.lastTick) { h.lastTick = Math.ceil(left); AU.sfx('tick'); } }
    // Any depleted shallow layer stays dangerous when revisited, even from another layer.
    run.tideDanger = run.P.y <= Layers.oxygenFront(run);
    if (run.tideDanger && h.entryGrace <= 0) {
      run.oxygenDamageT += dt;
      if (run.oxygenDamageT >= 2.4 && run.P.inv <= 0) { run.oxygenDamageT = 0; hurt(run, 1, 'tide'); }
    } else run.oxygenDamageT = 0;
    Layers.clearWater(run);
    h.ecologyCd -= dt;
    if (h.ecologyCd <= 0 && h.time >= 6) {
      h.ecologyCd = 3;
      const view = Math.hypot(G.VW, G.VH) / 2 / run.zoom;
      const alive = run.fish.filter(f => f.layerResident && !f.eventHunter && !f.dead && !f.retreat && f.homeZone === zone && f.r > run.P.r && relation(run, f) === 2 && dist(f.x, f.y, run.P.x, run.P.y) < view + 250);
      if (alive.length < (zone >= 5 ? 4 + Math.floor((zone - 5) / 2) : zone >= 2 ? 3 : 2)) {
        const sp = Layers.residentSpecies(run, pick(Layers.pool(zone))), c = Layers.outside(run, sp, R(0, Math.PI * 2));
        if (c) run.fish.push(Layers.enter(run, mkFish(run, sp, c[0], c[1], false)));
      }
    }
    return h;
  }
};

const I18N = {
  key: 'bigfish_language_v1', lang: 'en', cache: new Map(),
  init() {
    const requested = Q.get('lang'), saved = Store.get(this.key, 'en');

  },
  set(lang, persist = true) {
    this.lang = lang === 'zh' ? 'zh' : 'en';
    document.documentElement.lang = this.lang === 'zh' ? 'zh-CN' : 'en';
    document.title = this.lang === 'zh' ? '深海大鱼 · 大鱼吃小鱼' : 'BigFish · Deep Dive';
    if (persist) Store.set(this.key, this.lang);
  },
  text(value) {
    let text = String(value);
    if (this.lang === 'zh') return text;
    const cached = this.cache.get(text); if (cached !== undefined) return cached;
    const source = text;
    for (const key of I18N_KEYS) text = text.split(key).join(EN_TEXT[key]);
    if (this.cache.size > 3000) this.cache.clear();
    this.cache.set(source, text);
    return text;
  },
  toggle() { this.set(this.lang === 'en' ? 'zh' : 'en'); },
};

const I18N_KEYS = Object.keys(EN_TEXT).sort((a, b) => b.length - a.length);

// Body capsules follow the sprite body, excluding decorative fins, tail and bill.
const Combat = {
  pointSegment(x, y, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const t = clamp(((x - a.x) * dx + (y - a.y) * dy) / (dx * dx + dy * dy || 1), 0, 1);
    return Math.hypot(x - a.x - t * dx, y - a.y - t * dy);
  },
  distance(a, b) {
    const cross = (p, q, r) => (q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x);
    const c1 = cross(a.a, a.b, b.a), c2 = cross(a.a, a.b, b.b), c3 = cross(b.a, b.b, a.a), c4 = cross(b.a, b.b, a.b);
    if (c1 * c2 < 0 && c3 * c4 < 0) return 0;
    return Math.min(this.pointSegment(a.a.x, a.a.y, b.a, b.b), this.pointSegment(a.b.x, a.b.y, b.a, b.b), this.pointSegment(b.a.x, b.a.y, a.a, a.b), this.pointSegment(b.b.x, b.b.y, a.a, a.b));
  },
  body(o, player = false, x = o.x, y = o.y) {
    const sp = player ? CFG.spec(G.save.spec) : o.sp, sh = sp.shape;
    if (sp.special === 'jelly') {
      // The tall jelly sprite has its bell above its anchor and trailing tentacles below it.
      return { a: { x, y: y - o.r * 2.35 }, b: { x, y: y + o.r * 2.2 }, r: o.r * .75, mouth: { x, y }, forward: { x: 0, y: -1 } };
    }
    let L = o.r * (player ? 2.2 : 2.16) * (1 + (o.puff || 0) * .5), H, ox, oy, tail = .3;
    if (sh) {
      H = Math.max(3, L * sh.ar);
      const dh = sh.dorsal || .35, bill = sh.bill || 0;
      const w = L * (1.1 + (sh.tail || .32) + bill) + 4, h = H * (1.6 + dh * 1.6) + 4;
      ox = w / 2 - L * (.52 + bill) - 2; oy = h * ((dh > .6 ? .6 : .55) - .5); tail = sh.tail || .32;
    } else {
      const ar = { jelly: 1, turtle: .65, squid: .5, eel: .18, ray: .38, oar: .12, isopod: .6 };
      L *= sp.special === 'eel' ? 1.6 : sp.special === 'oar' ? 2 : 1;
      H = L * (ar[sp.special] || .5); ox = 0; oy = 0;
    }
    const face = o.face == null ? o.dir : o.face, dir = face >= 0 ? 1 : -1;
    const k = Math.max(.12, Math.abs(face)), ang = (o.ang || 0) * dir, ca = Math.cos(ang), sa = Math.sin(ang);
    const transform = (lx, ly) => ({ x: x + ca * lx * dir * k - sa * ly, y: y + sa * lx * dir * k + ca * ly });
    const radius = Math.max(2, Math.min(H * .36, L * .26));
    const half = Math.max(0, L * .43 - radius);
    // hull：整条可见的鱼（尾鳍尖到吻端、半个体高），用于"碰到就吃"
    const hullR = Math.max(radius, H * .5);
    const hull = { a: transform(ox - L * (.5 + tail * .85) + hullR, oy), b: transform(ox + L * .5 - hullR * .4, oy), r: hullR };
    return { a: transform(ox - half, oy), b: transform(ox + half, oy), r: radius, mouth: transform(ox + L * .45, oy), forward: { x: ca * dir, y: sa * dir }, hull };
  },
  contact(run, f, old) {
    const P = run.P, dx = P.x - (P.prevX ?? P.x), dy = P.y - (P.prevY ?? P.y);
    const fx = f.x - old.x, fy = f.y - old.y;

    let hit = false, front = false;
    for (let i = 0; i <= steps; i++) {

      if (edible ? (touch || mouthHit) : mouthHit) front = true;
    }

  },
  segmentHit(P, a, b, radius) {
    const dx = P.x - (P.prevX ?? P.x), dy = P.y - (P.prevY ?? P.y);
    const steps = Math.min(64, Math.max(1, Math.ceil(Math.hypot(dx, dy) / 3)));

  }

        act: () => { if (own) G.save.spec = sp.id; else if (ready && G.save.gold >= sp.cost) { G.save.gold -= sp.cost; G.save.specs[sp.id] = 1; G.save.spec = sp.id; AU.sfx('grow'); } } };
    }) },
    { name: '强化', note: () => '强化对所有物种生效', items: () => UPS.concat([{ id: 'sonar', name: '声呐', desc: '深海视野 +10/级' }]).map(u => {
      const lv = upLv(u.id), max = u.id === 'sonar' ? 5 : 10, cost = upCost(u.id);
      return { name: u.name + '  Lv.' + lv + '/' + max, desc: u.desc, sub: lv >= max ? '已满级' : '', icon: (x, cx, cy) => { x.fillStyle = '#04101e'; x.fillRect(cx - 26, cy - 26, 52, 52); for (let i = 0; i < max; i++) { x.fillStyle = i < lv ? '#5cf07a' : '#1a2a3a'; x.fillRect(cx - 22 + (i % 5) * 9, cy - 10 + Math.floor(i / 5) * 12, 7, 9); } },
        btn: lv >= max ? '满级' : cost + ' 金', disabled: lv >= max || G.save.gold < cost, btnCol: '#c88a1a',
        act: () => { if (lv < max && G.save.gold >= cost) { G.save.gold -= cost; G.save.up[u.id] = lv + 1; AU.sfx('coin'); } } };
    }) },
  ],
  resultRows: r => [['最大深度', Math.floor(r.maxDepth) + 'm'], ['最大连吞', 'x' + r.maxCombo], ['吞食', r.eaten + ' 条'], ['遗留物', (r.relics || 0) + ' 件']],
  resultTip(r) {

    if (!G.save.bosses.kraken && r.maxDepth > 900) return '提示：1050m 有巨型乌贼，打败它解锁锯齿鲨';

  },
});
SPECIES.forEach(s => { if (s.layer >= 5) { s.hint = ZONES[s.layer].name; return; } if (s.d[0] >= 1000) s.hint = s.d[0] >= 3000 ? '深渊出没' : '午夜层出没'; else if (s.d[0] >= 260) s.hint = '暮光层出没'; });

// ==== screens.js ====
// 局外界面（两版共用布局，绘制原语由各版本 W.* 提供）：暂停、结算、养成（多页签列表）、图鉴
const SCR = { tab: 0, page: 0, from: 'result', t: 0 };
function go(state, from) { G.state = state; SCR.from = from || SCR.from; UI.scroll = 0; SCR.t = 0; }
function restart() { G.paused = false; AU.duck(1); newRun(); }
function backFromSub() { G.state = SCR.from; UI.scroll = 0; }
function topBar(x, title) {

SCR.pause = x => {

  W.button(x, 'meta', CFG.metaName, bx, y, bw, 44, () => go('meta', 'pause')); y += 54;
  W.button(x, 'codex', '图鉴', bx, y, bw, 44, () => go('codex', 'pause')); y += 54;
  W.button(x, 'snd', '音效：' + (G.save.sound ? '开' : '关'), bx, y, (bw - 10) / 2, 44, () => { G.save.sound = G.save.sound ? 0 : 1; AU.setOn(!!G.save.sound); saveNow(); }, { col: '#5a6a88' });
  W.button(x, 'quit', '放弃本局', bx + (bw + 10) / 2, y, (bw - 10) / 2, 44, () => { G.paused = false; G.state = 'play'; endRun(G.run, 'quit'); }, { col: '#a83a4a' });
  if (W.guideHelp) W.guideHelp(x, cy + 166);

SCR.result = x => {

  W.bg(x);

  W.text(x, why, VW / 2, 54, 30, r.why === 'time' ? '#ffe85a' : '#ff8a8a', { align: 'center', stroke: 1 });
  W.panel(x, 20, 86, VW - 40, 214, 'gold');
  W.text(x, fmt(r.score), VW / 2, 128, 30, '#ffffff', { align: 'center' });
  W.text(x, r.newBest ? '★ 新纪录!' : '最高 ' + fmt(G.save.best.score), VW / 2, 162, 14, r.newBest ? '#ffe85a' : '#c8b88a', { align: 'center' });
  const rows = CFG.resultRows(r);
  rows.forEach(([k, v], i) => { const cx = 40 + (i % 2) * (VW - 80) / 2, cy = 196 + Math.floor(i / 2) * 28; W.text(x, k, cx, cy, 11, '#c8b88a'); W.text(x, v, cx + (VW - 80) / 2 - 16, cy, 14, '#ffffff', { align: 'right' }); });
  W.text(x, '+' + fmt(r.gold) + ' 金币', VW / 2, 282, 20, '#ffd23a', { align: 'center' });
  // 新收集
  let y = 316;
  if (r.newCodex.length) {
    W.text(x, '新收录 ' + r.newCodex.length, 24, y, 14, '#ffe85a'); y += 14;
    const ids = r.newCodex.slice(0, 6);
    ids.forEach((id, i) => { const gold = id.endsWith('*'), sp = CFG.codexItem(id.replace('*', '')); if (!sp) return; const cx = 24 + 30 + i * 58, cy = y + 30; W.panel(x, cx - 26, cy - 26, 52, 52, gold ? 'gold' : 'dim'); W.fishIcon(x, sp, cx, cy, 40, { gold }); });
    y += 70;
  }
  for (const u of r.unlocks || []) { W.panel(x, 24, y, VW - 48, 32, 'pink'); W.text(x, '★ ' + u, VW / 2, y + 16, 14, '#ff8af0', { align: 'center' }); y += 40; }
  const tip = CFG.resultTip(r); if (tip) { W.text(x, tip, VW / 2, Math.max(y + 10, VH - 210), 11, '#8ad0ff', { align: 'center' }); }
  const by = VH - 186;
  W.button(x, 'again', '再来一局', 30, by, VW - 60, 58, restart, { col: CFG.btnCol || '#2a9a5a' });
  W.button(x, 'meta', CFG.metaName, 30, by + 70, (VW - 70) / 2, 46, () => go('meta', 'result'));
  W.button(x, 'codex', '图鉴', 40 + (VW - 70) / 2, by + 70, (VW - 70) / 2, 46, () => go('codex', 'result'));
  W.text(x, '点空白处也能直接再来', VW / 2, VH - 44, 11, '#6a809a', { align: 'center' });

SCR.meta = x => {
  W.bg(x); topBar(x, CFG.metaName);
  const tabs = CFG.metaTabs(), VW = G.VW; SCR.tab = Math.min(SCR.tab, tabs.length - 1);

  UI.scrollable = true; UI.scrollMax = Math.max(0, items.length * (ih + 8) - viewH);

    const y = y0 + i * (ih + 8) - UI.scroll; if (y > G.VH || y + ih < y0) return;

    if (it.icon) it.icon(x, 58, y + ih / 2, 64);
    W.text(x, it.name, 104, y + 22, 16, it.state === 'lock' ? '#7a8498' : '#ffffff', { maxWidth: VW - 218 });
    W.text(x, it.desc, 104, y + 46, 11, it.state === 'lock' ? '#6a7488' : '#bfe9ff', { maxWidth: VW - 218 });
    if (it.sub) W.text(x, it.sub, 104, y + 68, 11, it.state === 'lock' ? '#ff9a7a' : '#ffd23a');
    const bx = VW - 104, by = y + ih / 2 - 20;
    const vis = y >= y0 - 2 && y + ih <= y0 + viewH + 2;
    if (it.state === 'sel') W.text(x, '使用中', bx + 44, y + ih / 2, 14, '#ffe85a', { align: 'center' });
    else if (it.btn && vis) W.button(x, 'it' + SCR.tab + '_' + i, it.btn, bx, by, 84, 40, () => { it.act(); saveNow(); }, { disabled: it.disabled, col: it.btnCol });
    else if (it.btn) W.text(x, it.btn, bx + 42, y + ih / 2, 11, '#8aa0b8', { align: 'center' });
  });
  x.restore();
};
SCR.codex = x => {
  W.bg(x); const S = G.save, VW = G.VW;
  const pages = CFG.codexPages(), total = pages.reduce((a, p) => a + p.ids.length, 0), got = pages.reduce((a, p) => a + p.ids.filter(id => S.codex[id]).length, 0);
  topBar(x, '图鉴 ' + got + '/' + total);
  SCR.page = Math.min(SCR.page, pages.length - 1);
  const tw = (VW - 16 - (pages.length - 1) * 6) / pages.length;
  pages.forEach((p, i) => { const done = p.ids.every(id => S.codex[id]); W.button(x, 'pg' + i, (done ? '★' : '') + p.name, 8 + i * (tw + 6), 68, tw, 36, () => { SCR.page = i; UI.scroll = 0; }, { col: i === SCR.page ? (CFG.btnCol || '#2a9a5a') : '#3a4a68' }); });
  const pg = pages[SCR.page];
  W.text(x, pg.bonus ? (pg.ids.every(id => S.codex[id]) ? '已集齐：' : '集齐本页：') + pg.bonus : '', VW / 2, 120, 11, '#ffd23a', { align: 'center' });
  const cols = 3, cw = (VW - 24 - (cols - 1) * 8) / cols, ch = 124, y0 = 134, viewH = G.VH - y0 - 8;
  const rows = Math.ceil(pg.ids.length / cols); UI.scrollable = true; UI.scrollMax = Math.max(0, rows * (ch + 8) - viewH);
  x.save(); x.beginPath(); x.rect(0, y0, VW, viewH); x.clip();
  pg.ids.forEach((id, i) => {
    const sp = CFG.codexItem(id), c = S.codex[id], cx = 12 + (i % cols) * (cw + 8), cy = y0 + Math.floor(i / cols) * (ch + 8) - UI.scroll;
    if (cy > G.VH || cy + ch < y0) return;

    W.fishIcon(x, sp, cx + cw / 2, cy + 46, cw - 26, { sil: !c, gold: c && c.g });
    W.text(x, c ? sp.name : '???', cx + cw / 2, cy + 90, 14, c ? '#ffffff' : '#6a7488', { align: 'center' });
    const st = !c ? 0 : 1 + (c.n >= 20 ? 1 : 0) + (c.p ? 1 : 0);
    W.text(x, '★'.repeat(st) + '☆'.repeat(3 - st), cx + cw / 2, cy + 110, 11, '#ffb02a', { align: 'center' });

  x.restore();
  W.text(x, '★ 吃到  ★★ 吃 20 条  ★★★ PERFECT 咬下 · 金色变种 2%', VW / 2, G.VH - 16, 11, '#6a809a', { align: 'center' });
};

// ==== main.js ====
// 启动与主循环：打开即开局（无封面），首次触摸时开启音频
function frame(ts) {
  const t = ts / 1000, elapsed = Math.max(0, t - (G.t || t)), rdt = Math.min(.05, elapsed); G.t = t; G.dt = rdt;
  if (!G.freeze) {
    AU.tick();
    if (G.state === 'play' && !G.paused && !document.hidden && G.run) { try { stepRun(G.run, rdt, elapsed); } catch (e) { console.error(e); } }
  }
  draw();
  requestAnimationFrame(frame);
}
// Reset the frame origin on background/resume; hidden time is never charged to oxygen.
document.addEventListener('visibilitychange', () => { G.t = 0; });
function draw() {
  const x = G.x; UI.begin();
  x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = CFG.letterbox || '#000'; x.fillRect(0, 0, G.cv.width, G.cv.height);
  x.setTransform(G.scale * G.dpr, 0, 0, G.scale * G.dpr, G.ox * G.dpr, G.oy * G.dpr);
  x.save(); x.beginPath(); x.rect(0, 0, G.VW, G.VH); x.clip();
  try {
    if (G.state === 'play' || G.state === 'pause') W.render(x);
    if (G.state === 'pause') SCR.pause(x);
    else if (G.state === 'result') SCR.result(x);
    else if (G.state === 'meta') SCR.meta(x);
    else if (G.state === 'codex') SCR.codex(x);
  } catch (e) { console.error(e); }
  if (W.languageMenu) W.languageMenu(x);
  x.restore();
}
function boot() {
  G.cv = document.getElementById('c'); G.x = G.cv.getContext('2d');
  if (W.initLanguage) W.initLanguage();
  loadSave(); AU.setOn(!!G.save.sound);
  // 调试：?spec=white&gold=9999&depth=1000&L=4
  if (Q.get('spec')) { G.save.spec = Q.get('spec'); G.save.specs[Q.get('spec')] = 1; }
  if (Q.get('gold')) G.save.gold = +Q.get('gold');
  addEventListener('resize', resize); resize();
  inBind(G.cv);
  newRun();
  if (Q.get('depth')) { G.run.P.y = +Q.get('depth') * (CFG.depthScale || 1); G.run.cam.y = G.run.P.y; G.run.fish = []; if (CFG.ver === "pixel") { G.run.depth = CFG.depthOf(G.run.P.y); G.run.unlocked = CFG.zoneOf(G.run); } }
  if (Q.get('L')) G.run.P.L = +Q.get('L');
  if (CFG.debug) CFG.debug(Q);
  window.G = G; window.DONE = true;
  requestAnimationFrame(frame);
}
const _fonts = (CFG.fonts || []).map(f => document.fonts && document.fonts.load('16px ' + f, '鱼').catch(() => { }));
Promise.race([Promise.all(_fonts), new Promise(r => setTimeout(r, 1200))]).then(boot);
